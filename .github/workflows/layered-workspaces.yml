name: layered-workspaces

on:
  pull_request:
    paths:
      - "trail/**"
      - "scripts/verify-linux-fuse-cow-docker.sh"
      - "scripts/verify-layered-lane-scale.sh"
      - "scripts/verify-rust-cache-isolation-docker.sh"
      - "scripts/verify-linux-node-layer-docker.sh"
      - "scripts/install-dokany.ps1"
      - "scripts/verify-linux-command-recipe-native.sh"
      - "scripts/verify-linux-command-recipe-sandbox.sh"
      - "scripts/verify-windows-command-recipe-sandbox.ps1"
      - "scripts/verify-macos-nfs-framework-layers.sh"
      - "scripts/verify-real-framework-handoff.sh"
      - "scripts/check-real-framework-handoff.py"
      - "scripts/test_check_real_framework_handoff.py"
      - "scripts/edit-real-framework-semantic.py"
      - "scripts/test_edit_real_framework_semantic.py"
      - "scripts/verify-environment-adapter-plugin.sh"
      - "scripts/verify-artifact-adapter-conformance.sh"
      - "scripts/verify-artifact-real-tool-gates.sh"
      - "scripts/verify-artifact-native-cow-matrix.py"
      - "scripts/verify-windows-environment-adapter-plugin.ps1"
      - "trail-environment-adapter-sdk/**"
      - ".github/workflows/layered-workspaces.yml"
  workflow_dispatch:
    inputs:
      run_scale:
        description: "Run the one-million-path / twenty-view acceptance test"
        required: false
        default: false
        type: boolean
      run_dokan_conformance:
        description: "Run experimental Dokan mount conformance tests"
        required: false
        default: false
        type: boolean
      run_macos_framework_bench:
        description: "Run real Next.js and Vite dependency/build benchmarks through macOS NFS"
        required: false
        default: false
        type: boolean
      run_real_framework_handoffs:
        description: "Qualify pinned Go, pnpm, npm, Python, and CMake repositories through A -> B -> C macOS NFS lanes"
        required: false
        default: false
        type: boolean

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p trail-environment-adapter-sdk --locked
      - run: cargo test -p trail view_core_ --no-default-features
      - if: ${{ runner.os != 'Windows' }}
        run: cargo test -p trail workspace_layer --no-default-features

  artifact-common-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/verify-artifact-adapter-conformance.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trail-artifact-common-contract-target

  artifact-real-tool-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: sudo chmod 666 /dev/fuse
      - run: node --version && npm --version && cmake --version && python3 --version
      - run: scripts/verify-artifact-real-tool-gates.sh
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"

  fuse-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: sudo chmod 666 /dev/fuse
      - run: cmake --version && cc --version && make --version
      - run: cargo test -p trail fuse_adapter_runs_shared_mounted_view_suite -- --nocapture
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
      - run: cargo test -p trail fuse_mount_reads_artifact_manifest_without_layer_materialization -- --nocapture
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
      - run: cargo test -p trail real_cmake_configure_build_and_clean_stay_lane_private -- --nocapture
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
      - run: cargo test -p trail real_python_venvs_embed_lane_paths_and_remain_isolated -- --nocapture
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
      - run: cargo test -p trail failed_mounted_initializer_preserves_previous_generation_and_real_uppers -- --nocapture
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
      - run: cargo test -p trail killing_mounted_python_initialization_never_exposes_a_partial_generation -- --nocapture
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
      - run: cargo test -p trail sync_all_initializes_nested_python_components_at_final_lane_paths -- --nocapture
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
      - name: Qualify CAS-backed FUSE artifact lifecycle
        run: >-
          python3 scripts/verify-artifact-native-cow-matrix.py
          --output "${{ runner.temp }}/artifact-native-cow/fuse-linux.json"
        env:
          TRAIL_RUN_FUSE_COW_TESTS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/trail-artifact-native-cow-target
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: artifact-native-cow-fuse-linux
          path: ${{ runner.temp }}/artifact-native-cow/fuse-linux.json
          if-no-files-found: error

  rust-cache-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-rust-cache-isolation-docker.sh

  node-layer-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-linux-node-layer-docker.sh

  command-recipe-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/verify-linux-command-recipe-native.sh

  adapter-plugin-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/verify-environment-adapter-plugin.sh

  windows-command-recipe-sandbox:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: |
          cmake --version
          cargo test -p trail windows_arguments_follow_command_line_to_argv_w_quoting -- --nocapture
          cargo test -p trail windows_recipe_publication_rejects_hard_link_aliases -- --nocapture

  nfs-conformance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cmake --version && cc --version && make --version
      - run: cargo test -p trail nfs_adapter_runs_shared_mounted_view_suite -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail nfs_mount_reads_artifact_manifest_without_layer_materialization -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail real_nfs_mount_records_new_modified_and_renamed_files -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail nfs_exec_checkpoint_and_recovery_are_fully_local -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail nfs_git_checkout_reset_and_clean_are_lane_local -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail nfs_real_node_layer_bulk_replacement_is_isolated -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail nfs_cargo_target_seed_is_shared_and_writable_targets_are_isolated -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail restricted_command_recipe_publishes_and_activates_multiple_outputs_atomically -- --nocapture
      - run: cargo test -p trail real_cmake_configure_build_and_clean_stay_lane_private -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail real_python_venvs_embed_lane_paths_and_remain_isolated -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail failed_mounted_initializer_preserves_previous_generation_and_real_uppers -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail killing_mounted_python_initialization_never_exposes_a_partial_generation -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - run: cargo test -p trail sync_all_initializes_nested_python_components_at_final_lane_paths -- --nocapture
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
      - name: Qualify CAS-backed NFS artifact lifecycle
        run: >-
          python3 scripts/verify-artifact-native-cow-matrix.py
          --output "${{ runner.temp }}/artifact-native-cow/nfs-macos.json"
        env:
          TRAIL_RUN_NFS_COW_TESTS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/trail-artifact-native-cow-target
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: artifact-native-cow-nfs-macos
          path: ${{ runner.temp }}/artifact-native-cow/nfs-macos.json
          if-no-files-found: error

  nfs-framework-bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_framework_bench }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/verify-macos-nfs-framework-layers.sh

  real-framework-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_framework_handoffs }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: real-framework-candidate
      - name: Build candidate Trail once
        run: cargo build -p trail --release --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trail-real-framework-target
      - uses: actions/upload-artifact@v4
        with:
          name: trail-real-framework-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/trail-real-framework-target/release/trail
          if-no-files-found: error

  real-framework-handoffs:
    needs: real-framework-candidate
    strategy:
      fail-fast: false
      matrix:
        framework: [go, pnpm, npm, python, cmake]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trail-real-framework-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/trail-real-framework-candidate
      - name: Restore candidate executable permission
        run: chmod 0755 "${{ runner.temp }}/trail-real-framework-candidate/trail"
      - if: ${{ matrix.framework == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - if: ${{ matrix.framework == 'pnpm' || matrix.framework == 'npm' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: ${{ matrix.framework == 'pnpm' }}
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: Qualify ${{ matrix.framework }} A -> B -> C handoff
        run: scripts/verify-real-framework-handoff.sh "${{ matrix.framework }}"
        env:
          TRAIL_BIN: ${{ runner.temp }}/trail-real-framework-candidate/trail
          TRAIL_FRAMEWORK_EVIDENCE_DIR: ${{ runner.temp }}/trail-real-framework-${{ matrix.framework }}
          TRAIL_FRAMEWORK_WORK_ROOT: ${{ runner.temp }}/trail-real-framework-work-${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: trail-real-framework-${{ matrix.framework }}
          path: ${{ runner.temp }}/trail-real-framework-${{ matrix.framework }}
          if-no-files-found: error

  dokan-conformance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dokan_conformance }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/install-dokany.ps1
      - shell: pwsh
        run: |
          $env:TRAIL_RUN_DOKAN_COW_TESTS = "1"
          cargo test -p trail dokan_adapter_runs_shared_mounted_view_suite -- --nocapture
          cargo test -p trail dokan_mount_reads_artifact_manifest_without_layer_materialization -- --nocapture
          cargo test -p trail foreground_dokan_mount_stops_through_a_separate_trail_handle -- --nocapture
          cargo test -p trail daemon_owned_dokan_mount_returns_ready_and_unmounts_asynchronously -- --nocapture
          cargo test -p trail real_windows_cmake_build_and_clean_stay_lane_private -- --nocapture
          cargo test -p trail real_windows_python_venvs_embed_lane_paths_and_remain_isolated -- --nocapture
          cargo test -p trail failed_mounted_initializer_preserves_previous_generation_and_real_uppers -- --nocapture
          cargo test -p trail killing_mounted_python_initialization_never_exposes_a_partial_generation -- --nocapture
          cargo test -p trail sync_all_initializes_nested_python_components_at_final_lane_paths -- --nocapture
      - run: ./scripts/verify-windows-command-recipe-sandbox.ps1
      - run: ./scripts/verify-windows-environment-adapter-plugin.ps1
      - name: Qualify CAS-backed Dokan artifact lifecycle
        shell: pwsh
        run: >-
          python scripts/verify-artifact-native-cow-matrix.py
          --output "${{ runner.temp }}/artifact-native-cow/dokan-windows.json"
        env:
          TRAIL_RUN_DOKAN_COW_TESTS: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/trail-artifact-native-cow-target
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: artifact-native-cow-dokan-windows
          path: ${{ runner.temp }}/artifact-native-cow/dokan-windows.json
          if-no-files-found: error

  million-path-scale:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scale }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /Volumes/Workspace/crabbuild-target/trail-layered-scale
      TRAIL_SCALE_EVIDENCE_DIR: /Volumes/Workspace/trail-layered-scale-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare isolated scale storage
        run: |
          sudo mkdir -p "$CARGO_TARGET_DIR" "$TRAIL_SCALE_EVIDENCE_DIR"
          sudo chown -R "$(id -u):$(id -g)" /Volumes/Workspace
      - run: scripts/verify-layered-lane-scale.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: layered-lane-scale-evidence
          path: /Volumes/Workspace/trail-layered-scale-evidence
          if-no-files-found: error
