schema = "trail.environment-adapter-conformance/v1"
adapter = "trail-examples/bazel@1"
identity_authorities = ["MODULE.bazel", "MODULE.bazel.lock", "WORKSPACE", "WORKSPACE.bazel", ".bazelrc", "trail.bazel.toml"]
